# Spring Boot only runs schema.sql automatically for embedded databases.
# PostgreSQL is not treated as one, so initialisation has to be requested explicitly.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# The schema is idempotent, so a failure here is a real problem worth stopping for.
spring.sql.init.continue-on-error=false

# No custom DataSource bean is defined - Spring Boot's own autoconfiguration
# builds one (HikariCP) from these properties as long as the driver is on the
# classpath. Overridable via env vars (SPRING_DATASOURCE_URL etc.) once this
# runs in Docker Compose.
spring.datasource.url=jdbc:postgresql://localhost:5432/kungfuchess
spring.datasource.username=kungfuchess
spring.datasource.password=kungfuchess
