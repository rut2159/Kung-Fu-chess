<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STOMP smoke test</title>
</head>
<body>
    <h2>STOMP ping/pong smoke test</h2>
    <p>Status: <span id="status">not connected</span></p>
    <input id="message" value="hello" />
    <button onclick="sendPing()">Send ping</button>
    <ul id="log"></ul>

    <h2>Send a move</h2>
    <p>
        from row <input id="fromRow" type="number" value="6" style="width:40px">
        from col <input id="fromCol" type="number" value="4" style="width:40px">
        to row   <input id="toRow"   type="number" value="4" style="width:40px">
        to col   <input id="toCol"   type="number" value="4" style="width:40px">
        <button onclick="sendMove()">Send move</button>
    </p>
    <p>(default values = white pawn e2-e4, a legal opening move)</p>

    <h2>Live game state (from /topic/game)</h2>
    <pre id="gameState">waiting for first broadcast...</pre>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script>
        const socket = new SockJS('http://localhost:8080/ws');
        const stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function () {
            document.getElementById('status').textContent = 'connected';

            stompClient.subscribe('/topic/pong', function (frame) {
                const li = document.createElement('li');
                li.textContent = 'received: ' + frame.body;
                document.getElementById('log').appendChild(li);
            });

            stompClient.subscribe('/topic/game', function (frame) {
                const state = JSON.parse(frame.body);
                document.getElementById('gameState').textContent = JSON.stringify(state, null, 2);
            });
        });

        function sendPing() {
            const message = document.getElementById('message').value;
            stompClient.send('/app/ping', {}, message);
        }

        function sendMove() {
            const command = {
                fromRow: Number(document.getElementById('fromRow').value),
                fromCol: Number(document.getElementById('fromCol').value),
                toRow: Number(document.getElementById('toRow').value),
                toCol: Number(document.getElementById('toCol').value)
            };
            stompClient.send('/app/move', {}, JSON.stringify(command));
        }
    </script>
</body>
</html>
